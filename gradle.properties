# gradle.properties: opciones de la JVM y del plugin de Android para todo el proyecto.

# Memoria máxima del daemon de Gradle (2 GB bastan para un módulo) y codificación
# UTF-8 para que los textos con tildes de los .java y los .xml no se lean mal.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# La clase R de cada módulo solo contiene sus propios recursos, no los de las
# librerías. Es lo que AGP recomienda y, como no hay librerías, no cambia nada.
android.nonTransitiveRClass=true
